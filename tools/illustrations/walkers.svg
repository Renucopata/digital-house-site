        <path d="M252 124 C254 138 290 140 294 122 M262 136 L263 160 M284 136 L286 158" filter="url(#wk-wobble)"/>

        <!-- board "d" (held at the hip, in front of the body) -->
        <g class="sign">
          <path d="M176 150 L370 166 L364 270 L170 256 Z" fill="#fdf1e0" filter="url(#wk-wobble)"/>
          <g filter="url(#wk-grain)" stroke="#d63b36" stroke-width="15" stroke-linecap="round">
            <circle cx="218" cy="222" r="24"/>
            <path d="M245 174 L245 248"/>
          </g>
          <!-- back hand on the board's edge -->
          <path d="M186 190 C174 186 165 194 168 203 C163 208 166 217 175 216 C180 221 190 216 189 207 Z M170 204 L181 203 M174 211 L184 209" fill="#fdf1e0" filter="url(#wk-wobble)"/>
